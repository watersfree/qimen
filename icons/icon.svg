<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#0033aa"/>
    </linearGradient>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="100%" stop-color="#f0e6c2"/>
    </radialGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#002277" stroke-width="10"/>
  <!-- Gold ring -->
  <circle cx="256" cy="256" r="200" fill="url(#goldGrad)" stroke="#d4af37" stroke-width="8"/>
  <!-- Bagua ticks -->
  <g stroke="#8b6508" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="65" x2="256" y2="85"/>
    <line x1="256" y1="427" x2="256" y2="447"/>
    <line x1="65" y1="256" x2="85" y2="256"/>
    <line x1="427" y1="256" x2="447" y2="256"/>
  </g>
  <!-- Taiji Center -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="140" fill="#f8f9fa" stroke="#333" stroke-width="4"/>
    <path d="M 0 -140 A 140 140 0 0 1 0 140 A 70 70 0 0 1 0 0 A 70 70 0 0 0 0 -140" fill="#22252a"/>
    <circle cx="0" cy="-70" r="20" fill="#f8f9fa"/>
    <circle cx="0" cy="70" r="20" fill="#22252a"/>
  </g>
</svg>
